[package]
name = "freja"
version = "0.1.0"
edition = "2024"
description = "A Discord bot with persistent memory that remembers conversations with users"
authors = ["Eddie Brunstedt <eddie.brunstedt@protonmail.com>"]
license = "MIT"
repository = "https://gitlab.com/eddiebrunstedt/freja"
keywords = ["discord", "bot", "chatbot"]

[dependencies]
chrono = "0.4.41"
poise = "0.6.1"
reqwest = { version = "0.12.22", features = ["json"] }
serde = "1.0.219"
serde_json = "1.0.141"
tokio = { version = "1", features = ["full"] }
